<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluare: scăderea cu împrumut (1.000 – 1.000.000)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#16204a;--muted:#555d80;--line:#9fb0e6;--rule:#16204a;--gold:#b8901f;--ok:#17803d;--bad:#c4122f;--btn:#16204a;--btn-ink:#fff;--soft:#e8ecf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e1c;--card:#141935;--ink:#eef0fa;--muted:#a3a9cc;--line:#5c70c4;--rule:#eef0fa;--gold:#f2d04b;--ok:#4cd281;--bad:#ff6b7d;--btn:#f2d04b;--btn-ink:#0b0e1c;--soft:#1c2347;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e1c;--card:#141935;--ink:#eef0fa;--muted:#a3a9cc;--line:#5c70c4;--rule:#eef0fa;--gold:#f2d04b;--ok:#4cd281;--bad:#ff6b7d;--btn:#f2d04b;--btn-ink:#0b0e1c;--soft:#1c2347;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.logo{width:76px;height:76px;object-fit:contain}
h1{margin:0;font-size:clamp(22px,5vw,32px);line-height:1.15}
.sub{margin:4px 0 0;color:var(--gold);font-size:15px;font-weight:600}
.who{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.who label{display:flex;gap:8px;align-items:baseline;flex:1 1 220px;font-size:15px}
.who input{flex:1;font:inherit;color:inherit;background:transparent;border:0;border-bottom:2px solid var(--line);padding:3px 2px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;background:var(--soft);border-radius:14px;margin-bottom:10px}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:7px 8px}
button{font:inherit;font-size:15px;padding:9px 16px;border-radius:999px;border:2px solid var(--btn);background:transparent;color:var(--ink);cursor:pointer}
button.main{background:var(--btn);color:var(--btn-ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.sum{padding:14px 16px;border-radius:14px;border:2px solid var(--gold);background:var(--card);margin-bottom:16px;font-size:17px;line-height:1.5}
.sum b{color:var(--gold)}
.ex{background:var(--card);border-radius:16px;padding:14px 18px 16px;margin-bottom:14px;border:1.5px solid transparent}
.ex.ok{border-color:var(--ok)}.ex.bad{border-color:var(--bad)}
.exh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.exh b{color:var(--gold);font-size:20px}
.badge{font-size:14px;font-weight:600}
.ex.ok .badge{color:var(--ok)}.ex.bad .badge{color:var(--bad)}
.vert{display:grid;width:max-content;max-width:100%;--cw:clamp(32px,8.2vw,46px);--gs:.55em;font-size:clamp(24px,6.4vw,34px);font-variant-numeric:tabular-nums;row-gap:4px;margin:2px 0}
.vert>div{box-sizing:border-box;height:1.45em;display:flex;align-items:center;justify-content:center;font-weight:600;line-height:1}
.vert>div.g{padding-left:var(--gs)}
.vert>.sg{justify-content:center;color:var(--gold);font-size:1.05em}
.vert>.rule{grid-column:1/-1;height:3px;background:var(--rule);border-radius:2px}
.vert input{width:calc(var(--cw) - 4px);height:1.4em;box-sizing:border-box;font:inherit;font-weight:700;text-align:center;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:7px;padding:0;-moz-appearance:textfield}
.ex.ok input{border-color:var(--ok)}.ex.bad input{border-color:var(--bad)}
.fb,.key{font-size:16px;margin-top:8px;display:none}
.ex.bad .fb{display:block;color:var(--bad)}
.show-key .key{display:block;color:var(--muted)}
.fb b,.key b{color:var(--ink)}
.pmeta{display:none}
@media print{
:root:root{--bg:#fff;--card:#fff;--ink:#111;--muted:#444;--line:#777;--rule:#111;--gold:#8a6a00;--soft:#fff;--ok:#111;--bad:#111}
@page{margin:12mm}
.controls,.hint,.sum,.badge{display:none!important}
body{background:#fff}main{max-width:none;padding:0}
.ex{break-inside:avoid;border:1px solid #bbb!important;margin-bottom:10px;padding:8px 14px}
.ex.bad .fb{display:none!important}
.vert input{border-color:#555}
.vert{font-size:26px;--cw:36px}
}
</style>
</head>

<script>
(function(){

var ins=art.querySelectorAll('input');
ins.forEach(function(inp,i){
inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(-1);clr(art);if(inp.value&&i>0)ins[i-1].focus()});
inp.addEventListener('focus',function(){inp.select()});
inp.addEventListener('keydown',function(ev){
if(ev.key==='Backspace'&&!inp.value&&i<n-1){ins[i+1].focus();ins[i+1].value='';ev.preventDefault()}
else if(ev.key==='ArrowLeft'&&i>0){ins[i-1].focus();ev.preventDefault()}
else if(ev.key==='ArrowRight'&&i<n-1){ins[i+1].focus();ev.preventDefault()}})});
return art}
function clr(a){a.className='ex';a.querySelector('.badge').textContent='';sum.hidden=true}
function check(){
var arts=list.children,ok=0,done=0;
items.forEach(function(e,i){
var a=arts[i],v=Array.prototype.map.call(a.querySelectorAll('input'),function(x){return x.value}).join('');
var badge=a.querySelector('.badge'),fb=a.querySelector('.fb');
if(!v){a.className='ex';badge.textContent='necompletat';return}
done++;var s=v.replace(/^0+(?=\d)/,'');
if(s===String(e.r)){ok++;a.className='ex ok';badge.textContent='✓ corect'}
else{a.className='ex bad';badge.textContent='✗ de verificat';fb.innerHTML='Răspuns corect: <b>'+fmt(e.r)+'</b>'}});
var N=items.length,p=Math.round(100*ok/N),q=p>=90?'Foarte bine (FB)':p>=70?'Bine (B)':p>=50?'Suficient (S)':'Insuficient (I)';
sum.hidden=false;
sum.innerHTML='Ai rezolvat corect <b>'+ok+' din '+N+'</b> exerciții ('+p+'%). Calificativ orientativ: <b>'+q+'</b>.'+(done<N?' Ai lăsat '+(N-done)+' necompletate.':'');
sum.scrollIntoView({behavior:'smooth',block:'nearest'})}
$('gen').onclick=build;$('chk').onclick=check;$('lvl').onchange=build;$('cnt').onchange=build;
$('key').onclick=function(){var on=document.body.classList.toggle('show-key');$('key').textContent=on?'Ascunde rezolvările':'Arată rezolvările'};
$('prt').onclick=function(){window.print()};
build();
})();
</script>
</body>
